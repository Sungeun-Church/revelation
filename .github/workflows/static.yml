name: Scheduled publication and Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC 00:00 = Korea 09:00. Follow-up runs retry missed publications.
    - cron: '0,5,10,15 0 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Publish files whose scheduled time has arrived
        id: prepare
        env:
          EVENT: ${{ github.event_name }}
        shell: bash
        run: |
          set -euo pipefail
          now=$(date -u +%Y-%m-%d-%H%M)
          changed=false
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            stamp="${file#scheduled-}"
            stamp="${stamp%.html}"
            [[ "$stamp" > "$now" ]] && continue
            sha256sum -c "$file.sha256"
            cp "$file" index.html
            rm "$file" "$file.sha256"
            changed=true
          done < <(find . -maxdepth 1 -name 'scheduled-????-??-??-????.html' | sed 's|^./||' | sort)
          if [ "$changed" = true ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add index.html scheduled-*
            git commit -m "Publish scheduled content ($now UTC)"
            git push origin HEAD:main
          fi
          if [ "$EVENT" != schedule ] || [ "$changed" = true ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
          fi
          echo "Checked scheduled publications at $now UTC; published=$changed" >> "$GITHUB_STEP_SUMMARY"
      - name: Stage only the public HTML
        if: steps.prepare.outputs.deploy == 'true'
        run: |
          mkdir -p _site
          cp index.html _site/index.html
      - uses: actions/configure-pages@v5
        if: steps.prepare.outputs.deploy == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.prepare.outputs.deploy == 'true'
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.prepare.outputs.deploy == 'true'
        uses: actions/deploy-pages@v4
      - name: Verify the public bytes
        if: steps.prepare.outputs.deploy == 'true'
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if curl -fsSL "https://sungeun-church.github.io/revelation/?verify=$GITHUB_RUN_ID-$attempt" -o /tmp/public.html && cmp -s index.html /tmp/public.html; then
              echo 'Public HTML matches the committed original.' >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            sleep 10
          done
          echo 'Public HTML did not match the original after deployment.' >&2
          exit 1
